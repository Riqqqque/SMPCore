name: Bug report
description: Report a bug, exploit, dupe, or broken behavior.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Explain the issue and what should have happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact actions needed to trigger it.
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      placeholder: Paper 26.1.2
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Add screenshots, console logs, or item data if useful.
