name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: SMPCore-plugin
          path: build/libs/SMPCore-1.0.0.jar

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: SMPCore-resource-pack
          path: build/resourcepack/SMPCore-resource-pack.zip
