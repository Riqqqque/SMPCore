# ============================================================
#  SMPCore Configuration
#  Author: Rique
# ============================================================

messages:
  prefix: "<dark_gray>[<gradient:#FF6B6B:#FFE66D>Server</gradient>]</dark_gray> "
  join-first: "<gold>Welcome, <white>{player}</white>!</gold>"
  join-return: "<aqua>> <white>{player}</white> has joined the server.</aqua>"
  quit: "<gray>< <white>{player}</white> has left the server.</gray>"

motd:
  enabled: true
  # Supports MiniMessage tags like <gradient:#00e5ff:#22c55e>Text</gradient>.
  # If legacy-color-codes is true, old color codes like &a, &l, &r, &#00ff99, and vanilla section codes also work.
  # Placeholders: {online}, {max}, {host}, {newline}
  legacy-color-codes: true
  lines:
    - "<gradient:#00e5ff:#22c55e><bold>Ethereal SMP</bold></gradient> &8| &f{online}&7/&f{max}"
    - "&7Custom powers, bosses, relics, and waystones."

smp-start:
  enabled: true
  world: "world"
  # While false, the configured world stays inside a tiny border and PvP is blocked.
  started: false
  started-at: 0
  pre-start-border-diameter: 75.0
  started-border-diameter: 10000.0
  border-expand-seconds: 0
  post-start-grace-minutes: 60
  lock-plugin-commands-before-start: true
  lock-block-edits-before-start: true
  start-broadcast: "<gold><bold>The SMP has started!</bold></gold> <gray>The world border is now <white>{border}</white> blocks wide. PvP unlocks in <white>{grace}</white>.</gray>"
  grace-deny-message: "<yellow>PvP is protected for <white>{time}</white>.</yellow>"
  lockdown-deny-message: "<yellow>The SMP has not started yet. Please wait for <white>/startsmp</white>.</yellow>"

combat:
  tag-seconds: 45

homes:
  default-max: 1
  multiple-max: 5

spawn:
  world: "world"

world-rules:
  force-hard-difficulty: true

back:
  on-death: true
  on-teleport: true

death-chest:
  enabled: true
  disable-in-player-combat: true
  lifetime-minutes: 90
  search-radius: 4
  vertical-search-radius: 4
  require-supporting-block: true
  require-clear-above: true
  allow-water-placement: false
  large-chest-enabled: true
  notify-when-no-space: true
  drop-overflow-items: true
  remove-when-empty: true
  notify-chat: true
  chest-name: "<gold><bold>{player}'s Death Chest</bold></gold>"
  chat-message: "<yellow>Your death chest is at <white>{world} {x}, {y}, {z}</white> and expires in <white>{minutes} minutes</white>.</yellow>"
  no-space-message: "<red>No space was found for a death chest, so your items dropped normally.</red>"
  note:
    enabled: true
    drop-if-inventory-full: true
    title: "<gold><bold>Death Chest</bold></gold>"
    lore:
      - "<gray>World: <white>{world}</white>"
      - "<gray>Coords: <white>{x}, {y}, {z}</white>"
      - "<gray>Expires in: <white>{minutes} minutes</white>"

spawner:
  silk-touch-enabled: true
  max-stack: 64
  hologram-view-range: 0.3

  speed:
    max-sugar: 32
    max-multiplier: 16.0

  ai-nerf:
    enabled: true

  redstone:
    powered-disables: true

  performance:
    min-delay-floor: 40
    stack-spawn-count-cap: 32
    max-nearby-entities-cap: 96

vein-miner:
  enabled: true
  default-player-enabled: true
  require-sneak: true
  search-diagonals: true
  max-blocks-per-chain: 96

  ores:
    enabled: true
    require-pickaxe: true
    families:
      coal:
        - COAL_ORE
        - DEEPSLATE_COAL_ORE
      copper:
        - COPPER_ORE
        - DEEPSLATE_COPPER_ORE
      iron:
        - IRON_ORE
        - DEEPSLATE_IRON_ORE
      gold:
        - GOLD_ORE
        - DEEPSLATE_GOLD_ORE
      redstone:
        - REDSTONE_ORE
        - DEEPSLATE_REDSTONE_ORE
      lapis:
        - LAPIS_ORE
        - DEEPSLATE_LAPIS_ORE
      diamond:
        - DIAMOND_ORE
        - DEEPSLATE_DIAMOND_ORE
      emerald:
        - EMERALD_ORE
        - DEEPSLATE_EMERALD_ORE
      nether_gold:
        - NETHER_GOLD_ORE
      quartz:
        - NETHER_QUARTZ_ORE
      ancient_debris:
        - ANCIENT_DEBRIS

  trees:
    enabled: true
    require-axe: true
    families:
      oak:
        - OAK_LOG
        - OAK_WOOD
      spruce:
        - SPRUCE_LOG
        - SPRUCE_WOOD
      birch:
        - BIRCH_LOG
        - BIRCH_WOOD
      jungle:
        - JUNGLE_LOG
        - JUNGLE_WOOD
      acacia:
        - ACACIA_LOG
        - ACACIA_WOOD
      dark_oak:
        - DARK_OAK_LOG
        - DARK_OAK_WOOD
      mangrove:
        - MANGROVE_LOG
        - MANGROVE_WOOD
      cherry:
        - CHERRY_LOG
        - CHERRY_WOOD
      pale_oak:
        - PALE_OAK_LOG
        - PALE_OAK_WOOD
      crimson:
        - CRIMSON_STEM
        - CRIMSON_HYPHAE
      warped:
        - WARPED_STEM
        - WARPED_HYPHAE

dragon-egg:
  speed-amplifier: 1
  check-interval: 10

crafting:
  golden-apple-surround-material: GOLD_NUGGET
  block-netherite-armor-upgrade: true

legendary-altar:
  enabled: true
  world: "world"
  roll-time-ticks: 13000
  nightly-chance: 0.05
  require-player-online: true
  activation-delay-seconds: 360
  expiration-hours: 1
  min-distance-from-spawn: 256
  max-distance-from-spawn: 2500
  location-search-attempts: 96
  beacon-view-range: 96
  bossbar:
    enabled: true

ender-sword:
  ender-bone-drop-count: 8
  summon-cooldown-seconds: 30
  killed-cooldown-seconds: 1800
  require-open-sky: true
  dragon:
    scale: 0.45
    max-health: 80.0
    horizontal-speed: 1.15
    vertical-speed: 0.75
    dismount-despawn-seconds: 10

frost-scythe:
  ability-cooldown-seconds: 15

bosses:
  double-drops:
    enabled: true
    timezone: "America/Denver"
    start-hour: 16
    end-hour: 18

awakening-table:
  enabled: true
  loot-chance: 0.05
  success-chance: 0.05
  failure-durability-loss-fraction: 0.50
  destroy-threshold: 0.15
  weapon-damage-multiplier: 2.0
  attack-speed-multiplier: 1.5
  armor-multiplier: 2.0
  armor-toughness-multiplier: 2.0
  knockback-resistance-multiplier: 2.0
  announce-success: true
  repair-vanilla-on-success: true
  hologram:
    enabled: true
    height: 1.9
    view-range: 32.0

thors-hammer:
  bonus-damage: 1.0

custom-enchants:
  wise:
    level-bonus:
      1: 0.15
      2: 0.30
      3: 0.40
    crop-xp: 2
  double-jump:
    ancient-city-chest-chance: 0.23
    vertical-boost: 0.82
    forward-boost: 0.75
    hunger-cost: 4
  dash:
    cooldown-seconds: 15
    horizontal-boost: 1.85
    vertical-boost: 0.42

custom-tools:
  advanced-pickaxe:
    enabled: true
    disable-bonus-with-silk-touch: true
    lucky-drop-chance: 0.25
    bonus-weights:
      coal: 1.0
      iron: 0.5
      redstone: 0.5
      gold: 0.3333
      lapis: 0.5
      copper: 1.0
      diamond: 0.25
      emerald: 0.25
  grapple-hook:
    cooldown-seconds: 3
    max-uses: 50

talisman-of-sustenance:
  interval-seconds: 7
  hunger-gain: 1
  heal-hearts: 1.0

reward-soul-lantern:
  cooldown-seconds: 1800
