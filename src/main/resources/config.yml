# ============================================================
#  SMPCore Configuration
#  Author: Rique
# ============================================================

messages:
  prefix: "<dark_gray>[<gradient:#FF6B6B:#FFE66D>Server</gradient>]</dark_gray> "
  join-first: "<gold><bold>* Welcome to the server, <white>{player}</white>! *</bold></gold> <gray>You are player number <yellow>{count}</yellow> to join!</gray>"
  join-return: "<aqua>> <white>{player}</white> has joined the server.</aqua>"
  quit: "<gray>< <white>{player}</white> has left the server.</gray>"

tpa:
  timeout: 120
  cooldown: 30
  teleport-delay: 3
  move-cancels: true

combat:
  tag-seconds: 15

homes:
  default-max: 1
  multiple-max: 5

spawn:
  world: "world"

world-rules:
  force-hard-difficulty: true

back:
  on-death: true
  on-teleport: true

spawner:
  silk-touch-enabled: true
  max-stack: 64
  hologram-view-range: 0.3

  speed:
    max-sugar: 32
    max-multiplier: 16.0

  ai-nerf:
    enabled: true

  redstone:
    powered-disables: true

  performance:
    min-delay-floor: 40
    stack-spawn-count-cap: 32
    max-nearby-entities-cap: 96

vein-miner:
  enabled: true
  default-player-enabled: true
  require-sneak: true
  search-diagonals: true
  max-blocks-per-chain: 96

  ores:
    enabled: true
    require-pickaxe: true
    families:
      coal:
        - COAL_ORE
        - DEEPSLATE_COAL_ORE
      copper:
        - COPPER_ORE
        - DEEPSLATE_COPPER_ORE
      iron:
        - IRON_ORE
        - DEEPSLATE_IRON_ORE
      gold:
        - GOLD_ORE
        - DEEPSLATE_GOLD_ORE
      redstone:
        - REDSTONE_ORE
        - DEEPSLATE_REDSTONE_ORE
      lapis:
        - LAPIS_ORE
        - DEEPSLATE_LAPIS_ORE
      diamond:
        - DIAMOND_ORE
        - DEEPSLATE_DIAMOND_ORE
      emerald:
        - EMERALD_ORE
        - DEEPSLATE_EMERALD_ORE
      nether_gold:
        - NETHER_GOLD_ORE
      quartz:
        - NETHER_QUARTZ_ORE
      ancient_debris:
        - ANCIENT_DEBRIS

  trees:
    enabled: true
    require-axe: true
    families:
      oak:
        - OAK_LOG
        - OAK_WOOD
      spruce:
        - SPRUCE_LOG
        - SPRUCE_WOOD
      birch:
        - BIRCH_LOG
        - BIRCH_WOOD
      jungle:
        - JUNGLE_LOG
        - JUNGLE_WOOD
      acacia:
        - ACACIA_LOG
        - ACACIA_WOOD
      dark_oak:
        - DARK_OAK_LOG
        - DARK_OAK_WOOD
      mangrove:
        - MANGROVE_LOG
        - MANGROVE_WOOD
      cherry:
        - CHERRY_LOG
        - CHERRY_WOOD
      pale_oak:
        - PALE_OAK_LOG
        - PALE_OAK_WOOD
      crimson:
        - CRIMSON_STEM
        - CRIMSON_HYPHAE
      warped:
        - WARPED_STEM
        - WARPED_HYPHAE

dragon-egg:
  speed-amplifier: 1
  check-interval: 10

crafting:
  golden-apple-surround-material: IRON_NUGGET
  block-netherite-armor-upgrade: true

legendary-altar:
  enabled: true
  world: "world"
  roll-time-ticks: 13000
  nightly-chance: 0.05
  require-player-online: true
  activation-delay-seconds: 360
  expiration-hours: 48
  min-distance-from-spawn: 256
  max-distance-from-spawn: 2500
  location-search-attempts: 96
  beacon-view-range: 96
  bossbar:
    enabled: true

ender-sword:
  ender-bone-drop-count: 8
  summon-cooldown-seconds: 300
  killed-cooldown-seconds: 1800
  require-open-sky: true
  dragon:
    scale: 0.45
    max-health: 80.0
    horizontal-speed: 1.15
    vertical-speed: 0.75
    dismount-despawn-seconds: 10

thors-hammer:
  bonus-damage: 1.0

custom-tools:
  amethyst-pickaxe:
    enabled: true
    strip-width: 3

  advanced-pickaxe:
    enabled: true
    disable-bonus-with-silk-touch: true
    bonus-chances:
      coal: 1.0
      iron: 0.6667
      redstone: 0.5
      gold: 0.3333
      lapis: 0.5
      copper: 1.0
      diamond: 0.1
      emerald: 0.1
