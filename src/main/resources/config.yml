# ============================================================
#  SMPCore Configuration
#  Author: Rique
# ============================================================

messages:
  prefix: "<dark_gray>[<gradient:#FF6B6B:#FFE66D>Server</gradient>]</dark_gray> "
  join-first: "<gradient:#8b5cf6:#22d3ee><bold>Season 5: Season of the Veil</bold></gradient> <dark_gray>·</dark_gray> <white>{player}</white> <gray>has joined for the first time.</gray>"
  join-return: "<aqua>> <white>{player}</white> has joined the server.</aqua>"
  quit: "<gray>< <white>{player}</white> has left the server.</gray>"

motd:
  enabled: true
  # Supports MiniMessage tags like <gradient:#00e5ff:#22c55e>Text</gradient>.
  # If legacy-color-codes is true, old color codes like &a, &l, &r, &#00ff99, and vanilla section codes also work.
  # Placeholders: {online}, {max}, {host}, {newline}
  legacy-color-codes: true
  lines:
    - "<gradient:#8b5cf6:#22d3ee><bold>✦ ETHEREAL SMP ✦</bold></gradient> <dark_gray>•</dark_gray> <white>{online}</white><gray>/</gray><white>{max}</white> <gray>online</gray>"
    - "<gradient:#f0abfc:#67e8f9><bold>SEASON V • SEASON OF THE VEIL</bold></gradient>"

# Optional launch gate. The live launch config enables this with owner UUIDs.
launch-access:
  enabled: false
  locked: false
  manage-vanilla-whitelist: true
  allowed-player-uuids: []
  denied-message: "<red>The server is still preparing for launch.</red> <gray>Please check back soon.</gray>"

smp-start:
  enabled: true
  world: "world"
  # While false, normal players see a personal barrier 15 blocks from exact spawn. The real world border stays full-sized.
  started: false
  started-at: 0
  pre-start-border-diameter: 30.0
  # Used only when /startsmp runs. After the SMP has started, manual /worldborder changes persist through restarts.
  started-border-diameter: 5000.0
  border-expand-seconds: 0
  post-start-grace-minutes: 60
  # Real 24-hour days counted from /startsmp. Day 3 begins after 48 hours; Day 5 after 96 hours.
  nether-unlock-day: 3
  end-unlock-day: 5
  # Optional exact UTC epoch milliseconds. A positive value overrides the matching day-based time.
  nether-unlock-at: 0
  # July 21, 2026 at 7:00 PM America/Denver (July 22 at 1:00 AM UTC).
  end-unlock-at: 1784682000000
  # Managed by /startsmp unlock. Both flags reset when a new SMP start state is created.
  nether-unlocked-early: false
  end-unlocked-early: false
  lock-plugin-commands-before-start: true
  lock-block-edits-before-start: true
  start-broadcast: "<gold><bold>The SMP has started!</bold></gold> <gray>The world border is now <white>{border}</white> blocks wide. PvP unlocks in <white>{grace}</white>.</gray>"
  grace-deny-message: "<yellow>PvP is protected for <white>{time}</white>.</yellow>"
  lockdown-deny-message: "<yellow>The SMP has not started yet. Please wait for <white>/startsmp</white>.</yellow>"

combat:
  tag-seconds: 45

boss-music:
  enabled: true
  # Every boss has a different original theme. It loops through the Records/Jukebox audio channel until the fight ends.
  volume: 0.68

homes:
  default-max: 1
  multiple-max: 5

wild:
  enabled: true
  # /wild always targets this Overworld, even when used from another dimension.
  world: "world"
  cooldown-seconds: 300
  # Landing blocks stay this far inside the live vanilla world border.
  border-padding: 32
  minimum-spawn-distance: 600
  # Candidates load one chunk at a time. Only this many player searches can generate chunks together.
  search-attempts: 24
  max-concurrent-searches: 2

spawn:
  world: "world"
  cooldown-seconds: 5
  exact:
    # /setspawn fills this in. Used for first joins, /spawn, and deaths without a bed or anchor.
    # Returning players keep the exact location where they logged out.
    set: false
    # Keeps vanilla world-spawn spreading off.
    enforce-spawn-radius-zero: true
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  ambience:
    enabled: true
    # Lightweight local particles and ambient sounds cover the wider spawn district.
    radius: 100
    song:
      enabled: true
      # Original 19-second note-block theme played through the Records/Jukebox audio channel.
      # Full volume through 100 blocks, then a smooth fade until 120 blocks.
      radius: 100
      fade-distance: 20
      interval-seconds: 300
      volume: 0.72
    wisps:
      enabled: true
    motes:
      # Sparse, player-local fireflies and drifting leaves. No entities are created.
      enabled: true
    rune-pulse:
      enabled: true
      interval-seconds: 35
    soundscape:
      enabled: true
      minimum-seconds: 18
      maximum-seconds: 32
  protection:
    enabled: true
    # Keeps vanilla's tiny world-spawn protection from fighting the custom region below.
    disable-vanilla-spawn-protection: true
    # Used until /spawnprotect pos1 and /spawnprotect pos2 mark a custom spawn region.
    radius: 150
    region:
      world: ""
      # Build/interact protection follows this. Mob spawn and mob entry always use the full X/Z column.
      full-height: true
      pos1:
        set: false
        x: 0
        y: 0
        z: 0
      pos2:
        set: false
        x: 0
        y: 0
        z: 0
    flags:
      - build
      - interact
      - pvp
      - hunger-drain
      - mob-grief
      - mob-spawns
      - mob-entry
      - explosions
      - fire
      - liquids
      - redstone
      - environment
      - natural-decay
      - crop-trample
      - bone-meal
      - weather-lock
      - entity-edit
    mob-control-defaults-added: true
    crop-trample-default-added: true
    natural-decay-default-added: true
    bone-meal-default-added: true
    weather-lock-default-added: true
    hunger-drain-default-added: true
    # Filled when /spawnprotect on/off confirm changes the master switch.
    last-toggle-by: "default"
    last-toggle-at: ""
    # Temporarily turn this on with /spawnprotect debug on when diagnosing mob spawn issues.
    debug-mob-spawns: false
    allowed-builders: []
    # Exact blocks the public can right-click while spawn interaction protection is on.
    # Use /spawnprotect stick, then confirm the same block twice.
    public-interactions: []
    deny-message: "<red>Spawn is protected. Ask staff if you need build access here.</red>"

world-rules:
  force-hard-difficulty: true

back:
  on-death: true
  on-teleport: true

death-chest:
  enabled: true
  lifetime-minutes: 90
  search-radius: 4
  vertical-search-radius: 4
  require-supporting-block: true
  require-clear-above: true
  allow-water-placement: false
  large-chest-enabled: true
  notify-when-no-space: true
  drop-overflow-items: true
  remove-when-empty: true
  notify-chat: true
  chest-name: "<gold><bold>{player}'s Death Chest</bold></gold>"
  chat-message: "<yellow>Your death chest is at <white>{world} {x}, {y}, {z}</white> and expires in <white>{minutes} minutes</white>.</yellow>"
  no-space-message: "<red>No safe death chest spot was available, so your items dropped normally.</red>"
  note:
    enabled: true
    drop-if-inventory-full: true
    title: "<gold><bold>Death Chest</bold></gold>"
    lore:
      - "<gray>World: <white>{world}</white>"
      - "<gray>Coords: <white>{x}, {y}, {z}</white>"
      - "<gray>Expires in: <white>{minutes} minutes</white>"

salvaging-depot:
  # Gear sits in this safe cancel window before it locks and starts recycling.
  cancel-window-seconds: 10
  processing-seconds: 6
  # 0.66 means roughly 66% of the base materials, scaled down by item damage.
  return-rate: 0.66

agricultural-pylon:
  enabled: true
  # Radius from the pylon block. 5 horizontal and 5 vertical is a 10x10x10 farm-protection zone.
  horizontal-radius: 5
  vertical-radius: 5

player-shops:
  enabled: true
  max-amount-per-purchase: 64
  max-price: 4096
  allow-owner-purchases: false

tab-list:
  # Keep every online, non-vanished player listed regardless of distance or world.
  always-show-online-players: true
  # Two seconds keeps ping/TPS current without rebuilding the panel every tick.
  refresh-ticks: 40
  server-title: "ETHEREAL SMP"
  season-title: "SEASON V · SEASON OF THE VEIL"
  footer-hint: "/menu  ·  /wiki  ·  /team"
  # UUIDs here receive the Owner title. If empty, launch-access owners are used.
  owner-uuids: []

player-finder-defense:
  # Hides enemy players from clients when they are too far away or behind blocks.
  # This makes client-side player finder HUD mods much less useful without breaking close PvP.
  # Automatically disabled while tab-list.always-show-online-players is true.
  enabled: true
  always-show-radius: 24.0
  line-of-sight-radius: 96.0
  hide-same-team: false
  ignore-ops: true

normal-essence:
  enabled: true
  notify: true
  # Balance/progress saves are batched so mining does not write to SQLite every block.
  flush-interval-seconds: 45
  mining:
    # Stone-like blocks are 1 point. Ores are worth more, ancient debris is worth the most.
    threshold-points: 250
    payout: 1
  xp:
    # Counts real XP gain events, not manual level edits.
    threshold-xp: 350
    payout: 1
  mobs:
    # Normal hostile mobs are 1 point. Stronger hostile mobs are worth more.
    threshold-points: 30
    payout: 2
  player-kills:
    payout: 12
    same-victim-cooldown-seconds: 1200

boss-dungeon:
  # Paid only by the summoner when their queued fight actually begins.
  # Teammates, allies, and spectators are not charged.
  essence-costs:
    yule_the_minion: 25
    kael_the_ashen: 40
    vesper_the_widow_queen: 60
    mirewood_the_root_tyrant: 80
    nereida_the_abyss_mother: 105
    iron_saint: 130
    aurelion_the_rift_seraph: 160
    morvessa_the_runebloom_witch: 195
    voralith_the_crimson_warden: 235
    corrupted_oathkeeper: 300

item-audit:
  # Scans online inventories for tracked custom item movement and duplicates.
  # Higher values reduce background work. Direct item events still log right away.
  scan-interval-seconds: 180

spawner:
  silk-touch-enabled: true
  max-stack: 64
  hologram-view-range: 0.3

  speed:
    max-sugar: 32
    max-multiplier: 16.0

  ai-nerf:
    enabled: true

  redstone:
    powered-disables: true

  performance:
    min-delay-floor: 40
    stack-spawn-count-cap: 32
    max-nearby-entities-cap: 96

vein-miner:
  enabled: true
  default-player-enabled: true
  require-sneak: true
  search-diagonals: true
  max-blocks-per-chain: 96

  ores:
    enabled: true
    require-pickaxe: true
    families:
      coal:
        - COAL_ORE
        - DEEPSLATE_COAL_ORE
      copper:
        - COPPER_ORE
        - DEEPSLATE_COPPER_ORE
      iron:
        - IRON_ORE
        - DEEPSLATE_IRON_ORE
      gold:
        - GOLD_ORE
        - DEEPSLATE_GOLD_ORE
      redstone:
        - REDSTONE_ORE
        - DEEPSLATE_REDSTONE_ORE
      lapis:
        - LAPIS_ORE
        - DEEPSLATE_LAPIS_ORE
      diamond:
        - DIAMOND_ORE
        - DEEPSLATE_DIAMOND_ORE
      emerald:
        - EMERALD_ORE
        - DEEPSLATE_EMERALD_ORE
      nether_gold:
        - NETHER_GOLD_ORE
      quartz:
        - NETHER_QUARTZ_ORE
      ancient_debris:
        - ANCIENT_DEBRIS

  trees:
    enabled: true
    require-axe: true
    families:
      oak:
        - OAK_LOG
        - OAK_WOOD
      spruce:
        - SPRUCE_LOG
        - SPRUCE_WOOD
      birch:
        - BIRCH_LOG
        - BIRCH_WOOD
      jungle:
        - JUNGLE_LOG
        - JUNGLE_WOOD
      acacia:
        - ACACIA_LOG
        - ACACIA_WOOD
      dark_oak:
        - DARK_OAK_LOG
        - DARK_OAK_WOOD
      mangrove:
        - MANGROVE_LOG
        - MANGROVE_WOOD
      cherry:
        - CHERRY_LOG
        - CHERRY_WOOD
      pale_oak:
        - PALE_OAK_LOG
        - PALE_OAK_WOOD
      crimson:
        - CRIMSON_STEM
        - CRIMSON_HYPHAE
      warped:
        - WARPED_STEM
        - WARPED_HYPHAE

dragon-egg:
  speed-amplifier: 1
  check-interval: 10

crafting:
  golden-apple-surround-material: GOLD_INGOT
  block-netherite-armor-upgrade: true

legendary:
  # Checks online inventories for duplicate exclusive legendary items.
  # Join and item-change checks still run outside this timer.
  duplicate-audit-interval-seconds: 30

legendary-altar:
  enabled: true
  world: "world"
  roll-time-ticks: 13000
  nightly-chance: 0.05
  require-player-online: true
  activation-delay-seconds: 360
  expiration-hours: 1
  min-distance-from-spawn: 256
  max-distance-from-spawn: 2500
  location-search-attempts: 96
  beacon-view-range: 96
  bossbar:
    enabled: true

ender-sword:
  ender-bone-drop-count: 8
  summon-cooldown-seconds: 30
  killed-cooldown-seconds: 1800
  require-open-sky: true
  dragon:
    scale: 0.45
    max-health: 80.0
    horizontal-speed: 1.15
    vertical-speed: 0.75
    dismount-despawn-seconds: 10

frost-scythe:
  ability-cooldown-seconds: 15

awakening-table:
  enabled: true
  rift-seraph-drop-chance: 0.025
  rift-seraph-awakening-shard-drop-chance: 0.25
  success-chance: 0.05
  failure-durability-loss-fraction: 0.50
  destroy-threshold: 0.15
  weapon-damage-multiplier: 2.0
  attack-speed-multiplier: 1.5
  armor-multiplier: 2.0
  armor-toughness-multiplier: 2.0
  knockback-resistance-multiplier: 2.0
  announce-success: true
  repair-vanilla-on-success: true
  hologram:
    enabled: true
    height: 1.9
    view-range: 32.0

thors-hammer:
  bonus-damage: 1.0
  true-damage: 6.0
  true-damage-cooldown-seconds: 12

custom-enchants:
  wise:
    level-bonus:
      1: 0.15
      2: 0.30
      3: 0.40
    crop-xp: 2
  double-jump:
    ancient-city-chest-chance: 0.23
    vertical-boost: 0.82
    forward-boost: 0.75
    hunger-cost: 2
  dash:
    cooldown-seconds: 15
    horizontal-boost: 1.85
    vertical-boost: 0.42

custom-tools:
  advanced-pickaxe:
    enabled: true
    disable-bonus-with-silk-touch: true
    lucky-drop-chance: 0.25
    bonus-weights:
      coal: 1.0
      iron: 0.5
      redstone: 0.5
      gold: 0.3333
      lapis: 0.5
      copper: 1.0
      diamond: 0.25
      emerald: 0.25
  grapple-hook:
    cooldown-seconds: 3
    max-uses: 50

talisman-of-sustenance:
  interval-seconds: 7
  hunger-gain: 1
  heal-hearts: 1.0

reward-soul-lantern:
  cooldown-seconds: 1800
