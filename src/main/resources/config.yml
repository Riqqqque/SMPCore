# ============================================================
#  SMPCore Configuration
#  Author: Rique
# ============================================================

messages:
  # MiniMessage format - https://docs.advntr.dev/minimessage/format.html
  prefix: "<dark_gray>[<gradient:#FF6B6B:#FFE66D>Server</gradient>]</dark_gray> "
  join-first: "<gold><bold>* Welcome to the server, <white>{player}</white>! *</bold></gold> <gray>You are player number <yellow>{count}</yellow> to join!</gray>"
  join-return: "<aqua>> <white>{player}</white> has joined the server.</aqua>"
  quit: "<gray>< <white>{player}</white> has left the server.</gray>"

tpa:
  timeout: 120
  cooldown: 30
  teleport-delay: 3
  move-cancels: true

combat:
  tag-seconds: 15

homes:
  default-max: 1
  multiple-max: 5

spawn:
  world: "world"

back:
  on-death: true
  on-teleport: true

spawner:
  silk-touch-enabled: true
  max-stack: 64
  hologram-view-range: 0.3

  speed:
    max-sugar: 32
    # 1.0x to 16.0x scaling based on sugar
    max-multiplier: 16.0

  ai-nerf:
    enabled: true

  redstone:
    # true: powered spawner is disabled
    # false: powered spawner is enabled
    powered-disables: true

  performance:
    # Prevent extreme stacked/sugar spawner throughput from overwhelming the server.
    min-delay-floor: 40
    stack-spawn-count-cap: 32
    max-nearby-entities-cap: 96

vein-miner:
  enabled: true
  default-player-enabled: true
  require-sneak: true
  search-diagonals: true
  max-blocks-per-chain: 96

  ores:
    enabled: true
    require-pickaxe: true
    families:
      coal:
        - COAL_ORE
        - DEEPSLATE_COAL_ORE
      copper:
        - COPPER_ORE
        - DEEPSLATE_COPPER_ORE
      iron:
        - IRON_ORE
        - DEEPSLATE_IRON_ORE
      gold:
        - GOLD_ORE
        - DEEPSLATE_GOLD_ORE
      redstone:
        - REDSTONE_ORE
        - DEEPSLATE_REDSTONE_ORE
      lapis:
        - LAPIS_ORE
        - DEEPSLATE_LAPIS_ORE
      diamond:
        - DIAMOND_ORE
        - DEEPSLATE_DIAMOND_ORE
      emerald:
        - EMERALD_ORE
        - DEEPSLATE_EMERALD_ORE
      nether_gold:
        - NETHER_GOLD_ORE
      quartz:
        - NETHER_QUARTZ_ORE
      ancient_debris:
        - ANCIENT_DEBRIS

  trees:
    enabled: true
    require-axe: true
    families:
      oak:
        - OAK_LOG
        - OAK_WOOD
      spruce:
        - SPRUCE_LOG
        - SPRUCE_WOOD
      birch:
        - BIRCH_LOG
        - BIRCH_WOOD
      jungle:
        - JUNGLE_LOG
        - JUNGLE_WOOD
      acacia:
        - ACACIA_LOG
        - ACACIA_WOOD
      dark_oak:
        - DARK_OAK_LOG
        - DARK_OAK_WOOD
      mangrove:
        - MANGROVE_LOG
        - MANGROVE_WOOD
      cherry:
        - CHERRY_LOG
        - CHERRY_WOOD
      pale_oak:
        - PALE_OAK_LOG
        - PALE_OAK_WOOD
      crimson:
        - CRIMSON_STEM
        - CRIMSON_HYPHAE
      warped:
        - WARPED_STEM
        - WARPED_HYPHAE

dragon-egg:
  speed-amplifier: 1
  check-interval: 10

crafting:
  block-netherite-armor-upgrade: true
