  smpcore.dungeon.admin:
    description: Build inside the protected boss dungeon and use boss test loadouts
    default: op
  smpcore.gmc:
    description: Use /gmc
    default: op
  smpcore.gms:
    description: Use /gms
    default: op
  smpcore.gma:
    description: Use /gma
    default: op
  smpcore.gmsp:
