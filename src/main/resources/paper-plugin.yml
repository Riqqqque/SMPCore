name: SMPCore
version: '${version}'
main: me.rique.smpcore.SMPCore
description: Core SMP plugin for spawners, homes, custom items, bosses, powers, and essentials
authors:
  - Rique
api-version: '26.1.2'

dependencies:
  server:
    floodgate:
      load: BEFORE
      required: false

permissions:
  # Spawner
  smpcore.spawner.use:
    description: Silk-touch spawners and apply modifiers (sugar, redstone, eye of ender)
    default: true
  smpcore.spawner.admin:
    description: Admin-level spawner commands
    default: op

  # Homes
  smpcore.home:
    description: Use /home, /sethome, /delhome, /homes
    default: true
  smpcore.home.multiple:
    description: Set more than one home (count controlled by config)
    default: false

  # Utility (player)
  smpcore.top:
    description: Use /top
    default: op
  smpcore.suicide:
    description: Use /suicide
    default: true
  smpcore.back:
    description: Use /back
    default: op
  smpcore.spawn:
    description: Use /spawn
    default: op
  smpcore.help:
    description: Use /help
    default: true
  smpcore.legendary.recipe:
    description: Use /lrecipe or /lrecipes
    default: true
  smpcore.team:
    description: Use /team and /tvault commands
    default: true
  smpcore.waystone.use:
    description: Use waystones
    default: true
  smpcore.backpack.use:
    description: Use backpacks
    default: true
  smpcore.enchants:
    description: Use /enchants
    default: true
  smpcore.awakening.use:
    description: Use Awakening Tables
    default: true
  smpcore.veinminer.use:
    description: Use /veinminer and native vein mining
    default: true

  # Admin
  smpcore.gmc:
    description: Use /gmc
    default: op
  smpcore.gms:
    description: Use /gms
    default: op
  smpcore.gma:
    description: Use /gma
    default: op
  smpcore.gmsp:
    description: Use /gmsp
    default: op
  smpcore.fly:
    description: Use /fly on yourself
    default: op
  smpcore.fly.others:
    description: Toggle fly for other players
    default: op
  smpcore.vanish:
    description: Use /vanish
    default: op
  smpcore.vanish.see:
    description: See vanished players
    default: op
  smpcore.heal:
    description: Use /heal on yourself
    default: op
  smpcore.heal.others:
    description: Heal other players
    default: op
  smpcore.feed:
    description: Use /feed on yourself
    default: op
  smpcore.feed.others:
    description: Feed other players
    default: op
  smpcore.speed:
    description: Use /speed on yourself
    default: op
  smpcore.speed.others:
    description: Set speed for other players
    default: op
  smpcore.god:
    description: Use /god on yourself
    default: op
  smpcore.god.others:
    description: Toggle god mode for other players
    default: op
  smpcore.invsee:
    description: Use /invsee
    default: op
  smpcore.nickname:
    description: Use /nick
    default: op
  smpcore.setspawn:
    description: Use /setspawn
    default: op
  smpcore.announce:
    description: Use /announce
    default: op
  smpcore.unban:
    description: Use /unban
    default: op
  smpcore.reload:
    description: Use /smpcore reload
    default: op
  smpcore.boss.admin:
    description: Use /bosses and custom boss controls
    default: op
  smpcore.legendary.admin:
    description: Use /legendary give
    default: op
  smpcore.replenish.admin:
    description: Use /replenishbook
    default: op
  smpcore.customenchant.admin:
    description: Use /delicatebook, /telekinesisbook, /smeltingtouchbook, /wisebook, and /doublejumpbook
    default: op
  smpcore.customitem.admin:
    description: Use /customitem give
    default: op
  smpcore.itemaudit.admin:
    description: Use /itemaudit
    default: op
  smpcore.superpower.admin:
    description: Use /powerinfo
    default: true
  smpcore.superpower.assign:
    description: Use /setpower
    default: op
  smpcore.reward.admin:
    description: Use /admin reward
    default: op
