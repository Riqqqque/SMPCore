name: SMPCore
version: '${version}'
main: me.rique.smpcore.SMPCore
description: Core SMP plugin for spawners, homes, custom items, bosses, classes, and essentials
authors:
  - Rique
api-version: '26.2'

dependencies:
  server:
    floodgate:
      load: BEFORE
      required: false
      join-classpath: true
    Citizens:
      load: BEFORE
      required: false
    HeadDatabase:
      load: BEFORE
      required: false

permissions:
  # Spawner
  smpcore.spawner.use:
    description: Silk-touch spawners and apply modifiers (sugar, redstone, eye of ender)
    default: true
  smpcore.spawner.admin:
    description: Admin-level spawner commands
    default: op

  # Homes
  smpcore.home:
    description: Use /home, /sethome, /delhome, /homes
    default: true
  smpcore.home.multiple:
    description: Set more than one home (count controlled by config)
    default: false
  smpcore.home.bypass-border:
    description: Use homes outside the current world border
    default: op

  # Utility (player)
  smpcore.top:
    description: Use /top
    default: op
  smpcore.suicide:
    description: Use /suicide
    default: true
  smpcore.back:
    description: Use /back
    default: op
  smpcore.spawn:
    description: Use /spawn
    default: true
  smpcore.spawn.cooldown.bypass:
    description: Bypass the /spawn cooldown
    default: op
  smpcore.wild:
    description: Use /wild, /rtp, and /randomtp
    default: true
  smpcore.wild.cooldown.bypass:
    description: Bypass the /wild cooldown
    default: op
  smpcore.help:
    description: Use /help
    default: true
  smpcore.changelog:
    description: Use /changelog, /changes, and /updates
    default: true
  smpcore.spinbet:
    description: Use /spinbet item wagers
    default: true
  smpcore.blackjack:
    description: Play blackjack through Silas and recover interrupted payouts
    default: true
  smpcore.roulette:
    description: Play European roulette through Renn and recover interrupted payouts
    default: true
  smpcore.bounties:
    description: View active player bounties with /bounties
    default: true
  smpcore.bossmastery.use:
    description: Use Mogrik's boss mastery ledger
    default: true
  smpcore.bossmastery.admin:
    description: Test and repair boss mastery progress
    default: op
  smpcore.blackmarket.use:
    description: Claim and replace unlocked boss souvenirs from Sable
    default: true
  smpcore.essence:
    description: Use /essence and view Essence balance
    default: true
  smpcore.reforge.use:
    description: Use Brannik reforger NPCs
    default: true
  smpcore.priest.use:
    description: Use Father Aldren priest NPCs
    default: true
  smpcore.corruption.use:
    description: Use Corruption Anchors
    default: true
  smpcore.menu:
    description: Use /menu and /smpmenu
    default: true
  smpcore.crossplay:
    description: Use /bedrock and /ability crossplay controls
    default: true
  smpcore.customanvil:
    description: Use crossplay-safe custom recipes from a placed anvil
    default: true
  smpcore.settings:
    description: Use /settings, /playersettings, and personal menu settings
    default: true
  smpcore.tab.title.owner:
    description: Show the Owner title in the server tab list
    default: false
  smpcore.tab.title.admin:
    description: Show the Admin title in the server tab list
    default: false
  smpcore.tab.title.moderator:
    description: Show the Moderator title in the server tab list
    default: false
  smpcore.tab.title.builder:
    description: Show the Builder title in the server tab list
    default: false
  smpcore.leaderboard:
    description: Use /leaderboards, /leaderboard, /lb, and /topstats
    default: true
  smpcore.bossbrews:
    description: Use /bossbrews, /bosspotions, and /brews
    default: true
  smpcore.bossrituals:
    description: Use /bossrituals, /bossritual, and /rituals
    default: true
  smpcore.dungeon.use:
    description: Enter the boss dungeon and summon bosses
    default: true
  smpcore.legendary.recipe:
    description: Use /lrecipe, /reliquary, and /mythics item menus
    default: true
  smpcore.team:
    description: Use /team and /tvault commands
    default: true
  smpcore.teamglow:
    description: Use /teamglow to privately outline teammates through walls
    default: true
  smpcore.waystone.use:
    description: Use waystones
    default: true
  smpcore.backpack.use:
    description: Use backpacks
    default: true
  smpcore.backpack.admin:
    description: Inspect and restore bounded backpack recovery snapshots
    default: op
  smpcore.inventoryrecovery.admin:
    description: Inspect and restore single-use snapshots from risky custom inventories
    default: op
  smpcore.goblins.admin:
    description: Give and move hidden goblin collectibles
    default: op
  smpcore.bedrockskulls.admin:
    description: Register custom player heads for Geyser Bedrock clients
    default: op
  smpcore.enchants:
    description: Use /enchants
    default: true
  smpcore.awakening.use:
    description: Use Awakening Tables
    default: true
  smpcore.veinminer.use:
    description: Use /veinminer and native vein mining
    default: true
  smpcore.wiki:
    description: Use /wiki, /guide, and /smpwiki
    default: true
  smpcore.story:
    description: Use The Eleventh Oath journal and story commands
    default: true
  smpcore.shop:
    description: Use /shops and create player chest shops
    default: true
  smpcore.stall.use:
    description: Buy and manage protected market stalls
    default: true
  smpcore.changelog.reload:
    description: Reload the player-facing changelog
    default: op
  smpcore.story.admin:
    description: Inspect, migrate, and edit The Eleventh Oath story profiles
    default: op

