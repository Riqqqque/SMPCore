name: SMPCore
version: '${version}'
main: me.rique.smpcore.SMPCore
description: Core SMP plugin — spawners, TPA, homes, essentials
authors:
  - Rique
api-version: '1.21.11'

permissions:
  # ── Spawner ──────────────────────────────────────────────
  smpcore.spawner.use:
    description: Silk-touch spawners and apply modifiers (sugar, redstone, eye of ender)
    default: true
  smpcore.spawner.admin:
    description: Admin-level spawner commands
    default: op

  # ── TPA ──────────────────────────────────────────────────
  smpcore.tpa:
    description: Use /tpa and /tpahere
    default: true
  smpcore.tpa.accept:
    description: Use /tpaccept, /tpdeny, /tpacancel
    default: true

  # ── Homes ─────────────────────────────────────────────────
  smpcore.home:
    description: Use /home, /sethome, /delhome, /homes
    default: true
  smpcore.home.multiple:
    description: Set more than one home (count controlled by config)
    default: false

  # ── Utility (player) ─────────────────────────────────────
  smpcore.top:
    description: Use /top
    default: op
  smpcore.suicide:
    description: Use /suicide
    default: true
  smpcore.back:
    description: Use /back
    default: true
  smpcore.spawn:
    description: Use /spawn
    default: true
  smpcore.help:
    description: Use /help
    default: true
  smpcore.legendary.recipe:
    description: Use /lrecipe or /lrecipes
    default: true
  smpcore.team:
    description: Use /team commands
    default: true
  smpcore.waystone.use:
    description: Use waystones
    default: true
  smpcore.backpack.use:
    description: Use backpacks
    default: true
  smpcore.enchants:
    description: Use /enchants
    default: true
  smpcore.veinminer.use:
    description: Use /veinminer and native vein mining
    default: true

  # ── Admin ─────────────────────────────────────────────────
  smpcore.gmc:
    description: Use /gmc
    default: op
  smpcore.gms:
    description: Use /gms
    default: op
  smpcore.gma:
    description: Use /gma
    default: op
  smpcore.gmsp:
    description: Use /gmsp
    default: op
  smpcore.fly:
    description: Use /fly on yourself
    default: op
  smpcore.fly.others:
    description: Toggle fly for other players
    default: op
  smpcore.vanish:
    description: Use /vanish
    default: op
  smpcore.vanish.see:
    description: See vanished players
    default: op
  smpcore.heal:
    description: Use /heal on yourself
    default: op
  smpcore.heal.others:
    description: Heal other players
    default: op
  smpcore.feed:
    description: Use /feed on yourself
    default: op
  smpcore.feed.others:
    description: Feed other players
    default: op
  smpcore.speed:
    description: Use /speed on yourself
    default: op
  smpcore.speed.others:
    description: Set speed for other players
    default: op
  smpcore.god:
    description: Use /god on yourself
    default: op
  smpcore.god.others:
    description: Toggle god mode for other players
    default: op
  smpcore.invsee:
    description: Use /invsee
    default: op
  smpcore.nickname:
    description: Use /nick
    default: op
  smpcore.setspawn:
    description: Use /setspawn
    default: op
  smpcore.reload:
    description: Use /smpcore reload
    default: op
  smpcore.legendary.admin:
    description: Use /legendary give
    default: op
  smpcore.replenish.admin:
    description: Use /replenishbook
    default: op
  smpcore.customenchant.admin:
    description: Use /delicatebook and /telekinesisbook
    default: op
